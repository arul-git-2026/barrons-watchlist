<style>
/* ═══ FEATURE: TABLE VIEW — START ══════════════════════════════
 * HTML  →  search "FEATURE: TABLE VIEW" in <body>      (~line 931)
 * JS    →  search "FEATURE: TABLE VIEW" in <script>    (~line 4597)
 * ═══════════════════════════════════════════════════════════════ */
/* ── Delete ticker UI ─────────────────────────────────────────── */
.tv-chk{width:14px;height:14px;cursor:pointer;accent-color:#c5221f;flex-shrink:0}
#tv-del-btn{
  display:none;align-items:center;gap:5px;padding:5px 12px;
  border:1px solid #c5221f;background:#fce8e6;border-radius:6px;
  font-size:12px;cursor:pointer;color:#c5221f;font-family:var(--font);
  transition:background .15s;white-space:nowrap
}
#tv-del-btn:hover{background:#f5c2c2}
#tv-sel-count{font-size:11px;color:#c5221f;font-weight:600}
.ctx-item.danger{color:#c5221f}
.ctx-item.danger:hover{background:#fce8e6}
#tv-tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);
  padding:0 20px;background:var(--card);flex-shrink:0}
.tv-tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--muted);
  cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;
  margin-bottom:-2px;transition:color .15s,border-color .15s;font-family:var(--font)}
.tv-tab:hover{color:var(--text)}
.tv-tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

#table-view{display:none;flex:1;overflow-y:auto;overflow-x:auto;background:var(--bg);min-height:0}
.tv-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tv-table thead th{
  position:sticky;top:0;z-index:5;
  background:var(--card);border-bottom:2px solid var(--border);
  padding:8px 10px;text-align:right;font-size:11px;font-weight:600;
  color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap
}
.tv-table thead th:hover{color:var(--text)}
.tv-table thead th.sorted-asc::after{content:' ↑'}
.tv-table thead th.sorted-desc::after{content:' ↓'}
.tv-table thead th.left{text-align:left}
.tv-table tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.tv-table tbody tr:hover{background:var(--accent-light)}
.tv-table td{padding:6px 10px;text-align:right;color:var(--text)}
.tv-table td.left{text-align:left}
.tv-table td.sec-cell{font-size:10px;color:var(--muted);font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.tv-table td.ticker-cell{font-family:'Roboto Mono',monospace;font-weight:700;color:var(--accent)}
.tv-up{color:#1a7f37}
.tv-dn{color:#c5221f}
.tv-neu{color:var(--muted)}
.tv-spark{vertical-align:middle}
#tv-loading{display:flex;align-items:center;justify-content:center;
  height:200px;color:var(--muted);font-size:13px}
#tv-toolbar{display:flex;align-items:center;gap:8px;padding:4px 16px;background:var(--bg)}
.tv-count{font-size:11px;color:var(--muted);margin-left:auto}
/* ═══ FEATURE: TABLE VIEW — END ════════════════════════════════ */
</style>

<!-- Table view container (hidden until tab clicked) -->
<div id="table-view">
  <div id="tv-toolbar" style="padding:6px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0">
    <span class="tv-count" id="tv-count" style="font-size:11px;color:var(--muted);flex:1"></span>
    <span id="tv-sel-count"></span>
    <button id="tv-del-btn" onclick="tvDeleteSelected()" title="Delete selected tickers from DB">
      🗑 Delete Selected
    </button>
    <span id="tv-asof" style="font-size:11px;color:var(--muted)"></span>
    <button onclick="tvRefresh()" id="tv-refresh-btn"
      style="display:flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--border);
             background:var(--bg);border-radius:6px;font-size:12px;cursor:pointer;color:var(--text);
             font-family:var(--font);transition:background .15s"
      onmouseover="this.style.background='var(--accent-light)'"
      onmouseout="this.style.background='var(--bg)'">
      ↺ Refresh
    </button>
  </div>
  <div id="tv-loading">Loading…</div>
  <table class="tv-table" id="tv-table" style="display:none">
    <thead id="tv-thead"></thead>
    <tbody id="tv-tbody"></tbody>
  </table>
</div>
<!-- ═══ FEATURE: TABLE VIEW — END ════════════════════════════════ -->
