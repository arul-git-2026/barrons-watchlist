<!-- ── Watchlist Manager Modal ───────────────────────────────────── -->
<div id="wl-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1200;align-items:center;justify-content:center" onclick="closeWlModal(event)">
  <div id="wl-modal" style="background:#fff;border-radius:12px;width:420px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.22);overflow:hidden" onclick="event.stopPropagation()">
    <!-- Header -->
    <div style="padding:16px 18px;border-bottom:1px solid #dadce0;display:flex;align-items:center;gap:10px">
      <span style="font-weight:700;font-size:15px;flex:1" id="wl-modal-title">Watchlist</span>
      <button onclick="wlModalRename()" style="border:1px solid #dadce0;background:#f8f9fa;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer" title="Rename watchlist">✏ Rename</button>
      <button onclick="wlModalDelete()" style="border:1px solid #fce8e6;background:#fce8e6;color:#c5221f;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer" title="Delete watchlist">🗑 Delete</button>
      <button onclick="closeWlModal()" style="border:none;background:none;font-size:18px;cursor:pointer;color:#5f6368;line-height:1">×</button>
    </div>
    <!-- Ticker list -->
    <div id="wl-modal-body" style="overflow-y:auto;padding:12px 16px;flex:1;display:flex;flex-direction:column;gap:4px"></div>
    <!-- Footer -->
    <div style="padding:12px 16px;border-top:1px solid #dadce0;display:flex;gap:8px;align-items:center">
      <input id="wl-modal-add-input" placeholder="Add ticker (e.g. AAPL)" style="flex:1;border:1px solid #dadce0;border-radius:6px;padding:6px 10px;font-size:13px" onkeydown="if(event.key==='Enter')wlModalAddTicker()">
      <button onclick="wlModalAddTicker()" style="background:#1a73e8;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer">Add</button>
    </div>
  </div>
</div>

<!-- Right-click context menu -->
<div id="ctx-menu">
  <div class="ctx-header" id="ctx-ticker-lbl">TICKER</div>
  <div id="ctx-wl-items"><!-- populated by JS --></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctx-new-wl" onclick="ctxNewWatchlist()">
    <span>＋</span> New watchlist…
  </div>
  <div id="ctx-del-wl-items"><!-- delete options populated by JS --></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-del-ticker-btn" onclick="ctxDeleteTicker()">
    <span>🗑</span> Delete ticker from DB
  </div>
</div>
