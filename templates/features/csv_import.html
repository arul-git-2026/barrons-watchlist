<style>
/* ── CSV Import Modal ────────────────────────────────────────────── */
#csv-import-modal{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(32,33,36,.5);align-items:center;justify-content:center
}
#csv-import-modal.visible{display:flex}
.cim-modal{
  background:var(--card);border-radius:12px;border:1px solid var(--border);
  box-shadow:0 8px 32px rgba(60,64,67,.25);
  width:560px;max-width:96vw;max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden
}
.cim-drop-zone{
  border:2px dashed var(--border);border-radius:8px;padding:28px 20px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
  background:var(--bg);user-select:none
}
.cim-drop-zone:hover,.cim-drop-zone.drag-over{border-color:var(--accent);background:var(--accent-light)}
.cim-drop-zone input[type=file]{display:none}
.cim-drop-icon{font-size:30px;margin-bottom:8px}
.cim-drop-txt{font-size:12px;color:var(--muted);line-height:1.7}
.cim-drop-txt b{color:var(--text)}
.cim-preview-wrap{
  max-height:180px;overflow-y:auto;border:1px solid var(--border);
  border-radius:6px;padding:10px;background:var(--bg);display:none
}
.cim-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.cim-pill{
  background:var(--accent-light);color:var(--accent);border-radius:4px;
  padding:2px 8px;font-size:11px;font-weight:600;
  font-family:'Roboto Mono',monospace;cursor:default
}
.cim-pill.dup{background:#fff3e0;color:#e65100}
.cim-stats{display:flex;gap:14px;font-size:11px;color:var(--muted);padding-top:4px;border-top:1px solid var(--border)}
.cim-stats b{font-weight:700}
.cim-stat-new{color:#137333}
.cim-stat-dup{color:#e65100}
</style>

<!-- ── CSV Import Modal ───────────────────────────────────────────── -->
<div id="csv-import-modal">
  <div class="cim-modal">
    <div class="atm-header">
      <h3>📥 Import tickers from CSV</h3>
      <button class="atm-close" onclick="closeCsvImport()">✕</button>
    </div>
    <div class="atm-body">
      <!-- Drop zone -->
      <div class="cim-drop-zone" id="cim-drop" onclick="document.getElementById('cim-file').click()">
        <input type="file" id="cim-file" accept=".csv,.txt">
        <div class="cim-drop-icon">📄</div>
        <div class="cim-drop-txt" id="cim-drop-txt">
          <b>Click to choose</b> or drag &amp; drop a CSV file<br>
          One ticker symbol per row (e.g. AAPL, TSLA, MSFT)
        </div>
      </div>
      <!-- Source + Tag -->
      <div class="atm-row">
        <div class="atm-field">
          <label>Source <span style="font-size:9px;color:var(--muted);text-transform:none;font-weight:400">(editable)</span></label>
          <input type="text" id="cim-source" placeholder="e.g. Finviz Screener" list="cim-source-list">
          <datalist id="cim-source-list"></datalist>
        </div>
        <div class="atm-field">
          <label>Tag <span style="font-size:9px;color:var(--muted);text-transform:none;font-weight:400">(editable)</span></label>
          <input type="text" id="cim-tag" placeholder="e.g. Tech Watchlist">
        </div>
      </div>
      <!-- Preview -->
      <div id="cim-preview-wrap" class="cim-preview-wrap">
        <div class="cim-pills" id="cim-pills"></div>
        <div class="cim-stats" id="cim-stats"></div>
      </div>
    </div>
    <div class="atm-footer">
      <button class="atm-cancel" onclick="closeCsvImport()">Cancel</button>
      <button class="atm-save" id="cim-submit-btn" disabled onclick="submitCsvImport()">Import</button>
    </div>
  </div>
</div>
