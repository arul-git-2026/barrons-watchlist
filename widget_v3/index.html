<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Streetwise Terminal V3</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<link rel="stylesheet" href="styles.css">

</head>
<body>

<div id="loader"><div class="spinner"></div></div>
<div id="toast"></div>

<!-- Chart filter right-click menu -->
<div id="chart-ctx-menu">
  <div class="cc-header">Show lines</div>
  <div class="cc-item" data-cf="all">
    <span class="cc-dot"></span>All tickers
  </div>
  <div class="cc-sep"></div>
  <div class="cc-item" data-cf="positive">
    <span class="cc-dot"></span>Positive only &nbsp;<span style="color:#4ade80;font-size:11px">＋</span>
  </div>
  <div class="cc-item" data-cf="negative">
    <span class="cc-dot"></span>Negative only &nbsp;<span style="color:#f87171;font-size:11px">－</span>
  </div>
</div>

<!-- Add Ticker modal -->
<div id="add-ticker-panel">
  <div class="add-ticker-modal">
    <div class="atm-header">
      <h3>Add ticker</h3>
      <button class="atm-close" id="atm-close-btn">✕</button>
    </div>
    <div class="atm-body">
      <div class="atm-row">
        <div class="atm-field">
          <label>Ticker symbol *</label>
          <input id="atm-ticker" placeholder="e.g. AAPL" style="font-family:monospace;font-weight:700;text-transform:uppercase">
        </div>
        <div class="atm-field">
          <label>Company name</label>
          <input id="atm-name" placeholder="e.g. Apple Inc.">
        </div>
      </div>
      <div class="atm-row">
        <div class="atm-field">
          <label>Sector</label>
          <input id="atm-sector" placeholder="e.g. Technology">
        </div>
        <div class="atm-field">
          <label>Type</label>
          <select id="atm-type">
            <option value="Stock">Stock</option>
            <option value="ETF">ETF</option>
            <option value="Fund">Fund</option>
          </select>
        </div>
      </div>
      <div class="atm-row">
        <div class="atm-field">
          <label>Status</label>
          <select id="atm-status">
            <option value="flat">Neutral</option>
            <option value="hot">Momentum</option>
            <option value="rot">Rotating</option>
            <option value="dip">Dip Buy</option>
            <option value="pull">Pullback</option>
            <option value="rec">Recovery</option>
            <option value="press">Pressure</option>
            <option value="caut">Caution</option>
          </select>
        </div>
        <div class="atm-field">
          <label>Ref price</label>
          <input id="atm-price" placeholder="e.g. ~$146">
        </div>
      </div>
      <div class="atm-row">
        <div class="atm-field">
          <label>Source name</label>
          <input id="atm-source" placeholder="e.g. My Research" value="My Research">
        </div>
        <div class="atm-field">
          <label>Tags / label</label>
          <input id="atm-tags" placeholder="e.g. Earnings play">
        </div>
      </div>
      <div class="atm-field full">
        <label>Summary / thesis</label>
        <textarea id="atm-summary" placeholder="Write your thesis here. You can use bullet points:&#10;• **Why I like it:** ...&#10;• **Risk:** ...&#10;• **Catalyst:** ..."></textarea>
      </div>
      <div class="atm-row">
        <div class="atm-field">
          <label>Base case</label>
          <input id="atm-base" placeholder="Most likely 12-month outcome">
        </div>
        <div class="atm-field">
          <label>Bear case</label>
          <input id="atm-bear" placeholder="Key downside risk">
        </div>
      </div>
      <div class="atm-field full">
        <label>Bull case</label>
        <input id="atm-bull" placeholder="Key upside catalyst">
      </div>
    </div>
    <div class="atm-footer">
      <button class="atm-cancel" id="atm-cancel-btn">Cancel</button>
      <button class="atm-save"   id="atm-save-btn">Save ticker</button>
    </div>
  </div>
</div>

<!-- ── Watchlist Manager Modal ───────────────────────────────────── -->
<div id="wl-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1200;align-items:center;justify-content:center" onclick="closeWlModal(event)">
  <div id="wl-modal" style="background:#fff;border-radius:12px;width:420px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.22);overflow:hidden" onclick="event.stopPropagation()">
    <!-- Header -->
    <div style="padding:16px 18px;border-bottom:1px solid #dadce0;display:flex;align-items:center;gap:10px">
      <span style="font-weight:700;font-size:15px;flex:1" id="wl-modal-title">Watchlist</span>
      <button onclick="wlModalRename()" style="border:1px solid #dadce0;background:#f8f9fa;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer" title="Rename watchlist">✏ Rename</button>
      <button onclick="wlModalDelete()" style="border:1px solid #fce8e6;background:#fce8e6;color:#c5221f;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer" title="Delete watchlist">🗑 Delete</button>
      <button onclick="closeWlModal()" style="border:none;background:none;font-size:18px;cursor:pointer;color:#5f6368;line-height:1">×</button>
    </div>
    <!-- Ticker list -->
    <div id="wl-modal-body" style="overflow-y:auto;padding:12px 16px;flex:1;display:flex;flex-direction:column;gap:4px"></div>
    <!-- Footer -->
    <div style="padding:12px 16px;border-top:1px solid #dadce0;display:flex;gap:8px;align-items:center">
      <input id="wl-modal-add-input" placeholder="Add ticker (e.g. AAPL)" style="flex:1;border:1px solid #dadce0;border-radius:6px;padding:6px 10px;font-size:13px" onkeydown="if(event.key==='Enter')wlModalAddTicker()">
      <button onclick="wlModalAddTicker()" style="background:#1a73e8;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer">Add</button>
    </div>
  </div>
</div>

<!-- Right-click context menu -->
<div id="ctx-menu">
  <div class="ctx-header" id="ctx-ticker-lbl">TICKER</div>
  <div id="ctx-wl-items"><!-- populated by JS --></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctx-new-wl" onclick="ctxNewWatchlist()">
    <span>＋</span> New watchlist…
  </div>
  <div id="ctx-del-wl-items"><!-- delete options populated by JS --></div>
</div>

<!-- Mobile sidebar overlay -->
<div id="mob-overlay" onclick="closeMobSidebar()"></div>
<!-- Mobile hamburger FAB -->
<button id="mob-menu-btn" onclick="toggleMobSidebar()" title="Open watchlist">☰</button>

<div class="layout">

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
    <div class="sidebar-header">
      <h2>Barrons<span class="logo-accent">Watchlists</span></h2>
      <div class="sub">
        <span class="dot" id="live-dot"></span>
        <span id="status-txt">Loading…</span>
        <span id="market-status-badge" style="font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600"></span>
        <button class="hdr-btn" id="refresh-btn" onclick="handleRefresh()"
                title="Refresh selected tickers, or all if none checked">
          <svg viewBox="0 0 24 24">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
          <span id="refresh-label">Refresh</span>
        </button>
        <button class="hdr-btn" id="add-ticker-btn" title="Add a new ticker with your own summary"
                style="border-color:var(--accent);color:var(--accent)">
          <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5"><path d="M12 5v14M5 12h14"/></svg>
          Add
        </button>

      </div>
    </div>

    <!-- Selection banner -->
    <div class="sel-banner" id="sel-banner">
      <span id="sel-count-txt"></span>
      <span class="sel-clear" onclick="clearSelection()">Clear all</span>
    </div>

    <!-- Hidden filter elements — moved to top-filter-bar in workspace -->
    <div style="display:none">
      <input type="text" id="srch" oninput="render()">
      <select id="f-sector"  onchange="render()"><option value="">All Sectors</option></select>
      <select id="f-type"    onchange="render()">
        <option value="">ETF + Stock</option>
        <option value="ETF">ETF</option>
        <option value="Stock">Stock</option>
      </select>
      <select id="f-status"  onchange="render()">
        <option value="">All Status</option>
        <option value="hot">Momentum</option>
        <option value="rot">Rotating</option>
        <option value="dip">Dip Buy</option>
        <option value="rec">Recovery</option>
        <option value="pull">Pullback</option>
        <option value="press">Pressure</option>
        <option value="caut">Caution</option>
        <option value="flat">Neutral</option>
      </select>
      <select id="f-rec"     onchange="render()"><option value="">All Recs</option></select>
      <select id="f-episode" onchange="render()"><option value="">All Episodes</option></select>
      <select id="f-move"    onchange="render()">
        <option value="">All Movers</option>
        <option value="up">Up today</option>
        <option value="down">Down today</option>
      </select>
      <select id="f-source" onchange="setSrcDropdown(this.value)">
        <option value="">All Sources</option>
      </select>
      <select id="f-watchlist" onchange="setWlFilter(this.value)">
        <option value="">All Tickers</option>
      </select>
    </div>

    <!-- Sort bar -->
    <div class="sort-bar">
      <!-- Select-all checkbox replaces the "Sort:" label -->
      <input type="checkbox" id="select-all-chk"
        title="Select / deselect all visible tickers"
        style="cursor:pointer;accent-color:var(--accent);width:14px;height:14px;margin-right:4px;flex-shrink:0"
        onclick="toggleSelectAll(this)">
      <button class="sb"    id="sb-t"     onclick="setSort('t')">Ticker</button>
      <button class="sb on" id="sb-pct"   onclick="setSort('pct')">Day %</button>
      <button class="sb"    id="sb-price" onclick="setSort('price')">Price</button>
      <button class="sb"    id="sb-ep"    onclick="setSort('ep')">Episodes</button>
      <button class="sb"    id="sb-name"  onclick="setSort('name')">Name</button>
      <button class="sb" id="sb-export" onclick="exportCSV()"
              title="Export visible tickers to CSV" style="margin-left:auto">
        ↓ CSV
      </button>
    </div>
    <div class="count-row" id="count-row">—</div>

    <!-- Table -->
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th width="32" title="Check to compare on chart"></th>
          <th>Symbol</th>
          <th style="text-align:right">Price</th>
          <th style="text-align:right">Day %</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
      <div class="empty" id="empty-msg" style="display:none">No matches.</div>
    </div>
  </div>

  <!-- ── Workspace ──────────────────────────────────────────────── -->
  <div class="workspace" id="workspace">

    <!-- ── Top filter bar — GF style above chart ─────────────────── -->
    <div class="top-filter-bar">
      <!-- Search row -->
      <div class="top-filter-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="srch-top" placeholder="Search ticker or name…"
               oninput="document.getElementById('srch').value=this.value;render()">
      </div>
      <!-- Filter selects row -->
      <div class="top-filter-row">
        <select id="tf-sector"  onchange="syncFilter('f-sector',this)"><option value="">Financial Servi</option></select>
        <select id="tf-type"    onchange="syncFilter('f-type',this)">
          <option value="">ETF + Stock</option>
          <option value="ETF">ETF</option>
          <option value="Stock">Stock</option>
        </select>
        <select id="tf-status"  onchange="syncFilter('f-status',this)">
          <option value="">All Status</option>
          <option value="hot">Momentum</option>
          <option value="rot">Rotating</option>
          <option value="dip">Dip Buy</option>
          <option value="rec">Recovery</option>
          <option value="pull">Pullback</option>
          <option value="press">Pressure</option>
          <option value="caut">Caution</option>
          <option value="flat">Neutral</option>
        </select>
        <select id="tf-rec"     onchange="syncFilter('f-rec',this)"><option value="">All Recs</option></select>
        <select id="tf-episode" onchange="syncFilter('f-episode',this)"><option value="">All Episodes</option></select>
        <select id="tf-move"    onchange="syncFilter('f-move',this)">
          <option value="">All Movers</option>
          <option value="up">Up today</option>
          <option value="down">Down today</option>
        </select>
        <select id="tf-source"  onchange="syncSrcFilter(this)"><option value="">All Sources</option></select>
        <select id="tf-watchlist" onchange="syncWlFilter(this)"><option value="">All Watchlists</option></select>
        <button id="wl-plot-btn" class="hdr-btn" onclick="plotWatchlist()"
                title="Plot this watchlist on the chart"
                style="display:none;padding:5px 10px;font-size:11px;
                       border-color:var(--accent);color:var(--accent)">
          📈 Plot
        </button>
        <!-- ═══ FEATURE: CRISIS MONITOR — START ══════════════════════════ -->
        <button id="crisis-toggle-btn" onclick="toggleCrisisPanel()" title="Global Crisis Monitor">
          🌍 Crisis Monitor
        </button>
        <button id="wl-manage-btn" onclick="openWlModal()" title="Manage watchlist" style="display:none;border:1px solid #dadce0;background:#f8f9fa;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;white-space:nowrap">✏ Manage</button>
      </div>
    </div>

    <!-- ── Global Crisis Monitor Panel ───────────────────────────── -->
    <div id="crisis-panel">
      <div class="crisis-header">
        <h3>🌍 Hormuz Crisis Monitor</h3>
        <span class="crisis-ts" id="crisis-ts"></span>
        <button onclick="loadCrisisMonitor(true)" style="border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer">↺ Refresh</button>
      </div>
      <!-- Summary bar -->
      <div id="crisis-summary" style="display:none">
        <div>
          <span class="cs-count" id="cs-count">0</span>
          <span style="font-size:13px;font-weight:700;color:var(--muted)">/7</span>
        </div>
        <div class="cs-label">CRISIS-END<br>SIGNALS</div>
        <div class="cs-bar"><div class="cs-bar-fill" id="cs-bar-fill"></div></div>
        <div class="cs-status" id="cs-status"></div>
        <div style="font-size:10px;color:var(--muted);margin-left:auto;max-width:220px;line-height:1.4" id="cs-desc"></div>
      </div>
      <div class="crisis-grid" id="crisis-grid">
        <div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--muted);font-size:12px">Loading crisis data…</div>
      </div>
    </div>
    <!-- ═══ FEATURE: CRISIS MONITOR — END ════════════════════════════ -->

<script src="app.js"></script>
</body>
</html>
